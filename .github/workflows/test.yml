# 两包测试 + 打包检查。engines 为 >=22.13.0（Node 20 已停止维护），矩阵覆盖 22 / 24 / 26
name: test
on:
  # push 只跑 main：其他分支（如 dependabot 的）走 PR 触发即可，免得同一提交跑两遍
  push:
    branches: [main]
  pull_request:
# 最小权限：只读代码。任何 job 都不需要写仓库 / 发包 / 改 issue。
permissions:
  contents: read
# ★ 第三方 action 一律锁提交 SHA（行尾注释标版本）：tag 可被改指，SHA 不能。升级由 dependabot 提 PR。
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
        # 6 个组合全跑：npm test 经 scripts/run-tests.mjs 列文件，不依赖 shell 展开 glob（Windows 的 cmd 不展开 glob）
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # ★ `--ignore-scripts`：本仓当前**零第三方依赖** ⇒ 今天拦不到任何东西，是**给将来加的依赖预留**。
      #   为什么现在就加：实测 npm 10 / 11（正是本矩阵跑的版本）下 `npm ci` **默认会执行**第三方包的
      #   preinstall / install / postinstall —— 只有 npm 12 才默认拦。哪天引入第一个依赖，这条立刻生效。
      #   同一条威胁模型下，本文件顶部已经立了「第三方 action 一律锁提交 SHA」；这里补的是 npm 侧那一半。
      #   ★ 挂在命令行而**不写 `.npmrc`**：实测 `ignore-scripts=true` 会**静默压掉** npm 12 的
      #     allowScripts 白名单（fail-safe 但无声），且项目级配置会波及本地 `npm install` 与将来的 pre/post 脚本。
      #   ★ 实测（npm 10.9.9 / 11.19.x / 12.2.0）：`npm ci --ignore-scripts` → `npm test`(473) → `npm run pack` 三段全绿。
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run pack

  lint:
    # 静态检查（死码一类）。★ 单独一个 job 而不是并进上面的矩阵：
    #   · 只跑一次 —— 矩阵里跑等于同一份代码在 6 个组合上各扫一遍，纯浪费；
    #   · 只在 ubuntu 跑 —— 静态检查与平台无关；且下方的 `*` 要靠 bash 展开（Windows 的 cmd 不展开，oxlint 自己也不展开）。
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # ★ 锁版本，不用 `@latest`：上游一发新版，代码一行没动 CI 也可能突然变红。
      #   升级是一个**有意的动作**（改这个字符串 + 本地先跑一遍），不是自动发生的事。
      # ★ 不写进 package.json：不碰运行时依赖，也不需要 `npm ci` —— 与仓库「零第三方依赖」一致。
      # ★ 只扫 src，不扫 test：test 里 `new Array(1_000_000)` 是**故意**造大数组（测预算上限），
      #   报出来的 no-new-array 是噪音。**src 当前零告警** —— 这条基线是有意的：
      #   从零开始，以后新冒出来的每一条都值得看一眼；一上来就带一堆已知噪音等于没有门禁。
      #   ★ 用 `packages/*/src`（不加引号，由 ubuntu 的 bash 展开），不显式列目录 —— 实测（oxlint 1.86.0）：
      #     · 显式列两个目录时，其中一个被改名 / 删掉 ⇒ oxlint 只扫剩下那个、**退出 0（静默变绿）**；
      #       新增第三个包 ⇒ 根本不在检查范围里，同样静默。
      #     · glob 自动覆盖新包；一个都匹配不到时 bash 原样传字面量 ⇒ oxlint "No files found" ⇒ 退出 1。
      #   ⚠️ 不要给它加引号（oxlint 自己不展开 glob ⇒ No files found），也不要把这一步挪到 Windows 上跑。
      #   ★ `import/no-cycle`：模块间不得成环（跨包经 `@cordium/kernel/internal` 的边也算）。实测造一个环即退出 1。
      #   ★ `--ignore-scripts`：与本文件顶部的供应链口径对齐。**但对这条链要说实话 —— 它今天拦不到任何东西**：
      #     实测 `npm view oxlint@1.86.0 scripts` 与其平台 binding 的 scripts **均为空**（无 install 脚本）。
      #     它也不是 `npx` 这条链的真实风险面：oxlint 不在本仓 lockfile 里、每次现拉 ⇒ **无 integrity 约束**，
      #     而「执行 oxlint 主程序」这件事本身就不受 `--ignore-scripts` 管。
      #     真要加固这一条，得把 oxlint 落进 devDependencies（带 integrity 后再 `--no-install` 跑）——
      #     那与上方「不写进 package.json、保持零依赖」的既定口径冲突，**留作待定**，此处只做口径对齐。
      - run: npx --yes --ignore-scripts oxlint@1.86.0 --deny-warnings --import-plugin -D import/no-cycle packages/*/src
